<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; /* Change this to match your picture's background color */
            overflow: hidden;
        }
        .fullscreen-bg {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Shows the whole picture without cutting anything off */
        }
    </style>
</head>
<body>
    <!-- Replace coming-soon.png with your exact filename if different -->
    <img src="coming-soon.png" class="fullscreen-bg" alt="Coming Soon">
</body>
</html>
