<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Removes any accidental scrollbars */
            background-color: #000000; /* Changes the tiny edge margins to black */
        }
        .fullscreen-bg {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Forces the image to cover the full screen */
            object-position: center; /* Keeps the middle of your image centered */
        }
    </style>
</head>
<body>
    <!-- Replace coming-soon.png with your exact clean image file name -->
    <img src="coming-soon.png" class="fullscreen-bg" alt="Coming Soon">
</body>
</html>
